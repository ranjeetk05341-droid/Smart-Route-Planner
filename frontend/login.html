<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Smart Route Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md p-8 rounded-2xl bg-white border border-slate-200 shadow-md">
    <div class="text-center mb-6">
      <div class="w-11 h-11 rounded-full bg-[#1a73e8] mx-auto flex items-center justify-center text-white mb-3 shadow-md shadow-blue-500/25">
        <i data-lucide="navigation" class="w-5 h-5"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-900">Sign In</h2>
      <p class="text-xs text-slate-500 mt-1">Access your saved places and route history</p>
    </div>

    <!-- Quick Demo Login Button -->
    <div class="p-3 mb-5 rounded-xl bg-blue-50 border border-blue-200 flex items-center justify-between">
      <div class="text-xs">
        <div class="font-bold text-[#1a73e8]">Quick Evaluation Credentials</div>
        <div class="text-[11px] text-slate-500">demo / password123</div>
      </div>
      <button id="fill-demo-btn" class="px-3 py-1.5 rounded-lg bg-[#1a73e8] hover:bg-[#1557b0] text-white font-semibold text-xs transition">
        Auto Fill
      </button>
    </div>

    <form id="login-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Username or Email</label>
        <input type="text" id="identity-input" required placeholder="demo or student@college.edu"
               class="w-full text-xs py-2.5 px-3 rounded-lg bg-white border border-slate-300 text-slate-800 focus:outline-none focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="password-input" required placeholder="••••••••"
               class="w-full text-xs py-2.5 px-3 rounded-lg bg-white border border-slate-300 text-slate-800 focus:outline-none focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8]">
      </div>

      <div id="login-error" class="hidden text-xs text-red-600 p-2 rounded-lg bg-red-50 border border-red-200"></div>

      <button type="submit" id="submit-btn" class="w-full py-2.5 rounded-lg bg-[#1a73e8] hover:bg-[#1557b0] text-white font-bold text-xs shadow-sm transition">
        <span>Sign In</span>
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
      Don't have an account? <a href="/register" class="text-[#1a73e8] hover:underline font-semibold">Register here</a>
      <div class="mt-2">
        <a href="/dashboard" class="text-slate-400 hover:text-slate-600 text-[11px]">Continue as Guest to Dashboard &rarr;</a>
      </div>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    lucide.createIcons();

    document.getElementById('fill-demo-btn').addEventListener('click', () => {
      document.getElementById('identity-input').value = 'demo';
      document.getElementById('password-input').value = 'password123';
    });

    document.getElementById('login-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const identity = document.getElementById('identity-input').value.trim();
      const password = document.getElementById('password-input').value;
      const errorDiv = document.getElementById('login-error');
      const submitBtn = document.getElementById('submit-btn');

      errorDiv.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Signing in...';

      try {
        const res = await api.login(identity, password);
        localStorage.setItem('srp_user', JSON.stringify(res.user));
        window.location.href = '/dashboard';
      } catch (err) {
        errorDiv.textContent = err.message || 'Login failed';
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Sign In';
      }
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | Smart Route Planner</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md p-8 rounded-2xl bg-white border border-slate-200 shadow-md">
    <div class="text-center mb-6">
      <div class="w-11 h-11 rounded-full bg-[#1a73e8] mx-auto flex items-center justify-center text-white mb-3 shadow-md shadow-blue-500/25">
        <i data-lucide="user-plus" class="w-5 h-5"></i>
      </div>
      <h2 class="text-xl font-bold text-slate-900">Create Account</h2>
      <p class="text-xs text-slate-500 mt-1">Join Smart Route Planner for tailored navigation</p>
    </div>

    <form id="register-form" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Username</label>
        <input type="text" id="username-input" required placeholder="john_doe"
               class="w-full text-xs py-2.5 px-3 rounded-lg bg-white border border-slate-300 text-slate-800 focus:outline-none focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Email Address</label>
        <input type="email" id="email-input" required placeholder="john@example.com"
               class="w-full text-xs py-2.5 px-3 rounded-lg bg-white border border-slate-300 text-slate-800 focus:outline-none focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" id="password-input" required minlength="6" placeholder="At least 6 characters"
               class="w-full text-xs py-2.5 px-3 rounded-lg bg-white border border-slate-300 text-slate-800 focus:outline-none focus:border-[#1a73e8] focus:ring-1 focus:ring-[#1a73e8]">
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 mb-1">Default Vehicle Type</label>
        <select id="vehicle-input" class="w-full text-xs py-2.5 px-3 rounded-lg bg-white border border-slate-300 text-slate-800 focus:outline-none focus:border-[#1a73e8]">
          <option value="petrol">🚗 Petrol Car (15 km/L)</option>
          <option value="diesel">🚙 Diesel SUV (13 km/L)</option>
          <option value="ev">⚡ Electric Vehicle (6.5 km/kWh)</option>
          <option value="hybrid">🌱 Hybrid (22 km/L)</option>
          <option value="bike">🏍 Two-Wheeler (45 km/L)</option>
        </select>
      </div>

      <div id="reg-error" class="hidden text-xs text-red-600 p-2 rounded-lg bg-red-50 border border-red-200"></div>

      <button type="submit" id="submit-btn" class="w-full py-2.5 rounded-lg bg-[#1a73e8] hover:bg-[#1557b0] text-white font-bold text-xs shadow-sm transition">
        <span>Register Account</span>
      </button>
    </form>

    <div class="mt-6 text-center text-xs text-slate-500">
      Already have an account? <a href="/login" class="text-[#1a73e8] hover:underline font-semibold">Sign In here</a>
    </div>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/api.js"></script>
  <script>
    lucide.createIcons();

    document.getElementById('register-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('username-input').value.trim();
      const email = document.getElementById('email-input').value.trim();
      const password = document.getElementById('password-input').value;
      const vehicle_type = document.getElementById('vehicle-input').value;
      const errorDiv = document.getElementById('reg-error');
      const submitBtn = document.getElementById('submit-btn');

      errorDiv.classList.add('hidden');
      submitBtn.disabled = true;
      submitBtn.innerHTML = 'Creating account...';

      try {
        const res = await api.register(username, email, password, { vehicle_type });
        localStorage.setItem('srp_user', JSON.stringify(res.user));
        window.location.href = '/dashboard';
      } catch (err) {
        errorDiv.textContent = err.message || 'Registration failed';
        errorDiv.classList.remove('hidden');
        submitBtn.disabled = false;
        submitBtn.innerHTML = 'Register Account';
      }
    });
  </script>
</body>
</html>
